# Render Blueprint Deployment Configuration
# Police Welfare Application (காவலர் குடும்ப நல அறக்கட்டளை)

services:
  # Python FastAPI Backend Web Service (Free Tier)
  - type: web
    name: police-welfare-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: police-welfare-db
          property: connectionString

  # React Frontend Static Site (Automatically Free)
  - type: web
    name: police-welfare-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: police-welfare-backend
          property: host

# Production database for Render; SQLite is not durable on free hosting.
databases:
  - name: police-welfare-db
    databaseName: police_welfare
    user: police_welfare
